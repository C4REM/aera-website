<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sign — Aera</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo/aera-monogram-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/client/client.css">
<script src="/client/forms.js"></script>
<style>
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
.top{padding:16px 0}
main{padding:28px 0 60px}
.signbox{background:#FBF8F2;border:1px solid var(--line);border-radius:6px;padding:22px;margin:24px auto 0;max-width:760px}
.signbox h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 14px}
.pad{position:relative}
.pad canvas{width:100%;height:170px;background:#fff;border:1px solid var(--field);border-radius:4px;touch-action:none;display:block;cursor:crosshair}
.pad .clr{position:absolute;top:8px;right:8px;background:var(--paper);border:1px solid var(--field);border-radius:4px;font-size:12.5px;padding:4px 9px;cursor:pointer}
.pad .hint{position:absolute;left:14px;bottom:10px;font-size:12.5px;color:var(--stone);pointer-events:none}
.row{margin-bottom:14px}
.done{text-align:center;padding:12px 0 6px}
@media print{.top,.signbox,.noprint{display:none!important}main{padding:0}}
</style>
</head>
<body>
<div class="band top"><div class="wrap"><a class="mark" href="/"><svg viewBox="61 51 78 98" fill="none" aria-hidden="true"><path d="M100,60 L70,100 L130,100 Z M100,140 L70,100 M130,100 L100,140 M82,85 L118,85 M82,115 L118,115" stroke="#C2A878" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>AERA</span></a></div></div>
<main class="wrap"><div id="doc"><div class="skeleton" style="height:420px;max-width:760px;margin:0 auto"></div></div><div id="box"></div></main>
<script>
(function(){
'use strict';
const F = window.AERA_FORMS, $ = id => document.getElementById(id), esc = F.esc;
const st = document.createElement('style'); st.textContent = F.css; document.head.appendChild(st);
const key = location.hash.slice(1);
let data = null;
const call = (method, body) => fetch('/api/sign', { method, headers: Object.assign({ 'X-Key': key }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
function show(){
  $('doc').innerHTML = F.render(data.form, data.job);
  document.title = (data.form.title || F.defs[data.form.type].title) + ' — Aera';
  if (data.form.sig){
    $('box').innerHTML = `<div class="signbox done noprint"><h2>Signed. Thank you</h2><p class="muted" style="margin:0 0 16px">A copy is kept by Aera. You can save your own below.</p><button class="btn" id="pr">Print or save as PDF</button></div>`;
    $('pr').onclick = () => window.print(); return;
  }
  const talent = data.form.type === 'talent';
  $('box').innerHTML = `<form class="signbox" id="sf" novalidate><h2>Sign</h2>
    <div class="row"><label class="lab">Your full name<input class="field" name="name" autocomplete="name" required></label></div>
    ${talent ? `<div class="row"><label class="chk" style="display:flex;gap:10px;align-items:center;font-size:14.5px"><input type="checkbox" name="minor"> I'm under 18 (a parent or guardian signs)</label></div>
      <div class="row" id="gr" hidden><label class="lab">Parent or guardian's full name<input class="field" name="guardian"></label></div>` : ''}
    <div class="row"><span class="lab" style="display:block;margin-bottom:6px">Signature${talent ? ' (parent or guardian if under 18)' : ''}</span>
      <div class="pad"><canvas id="cv" aria-label="Signature pad"></canvas><button type="button" class="clr" id="clr">Clear</button><span class="hint" id="hint">Sign here with your finger or mouse</span></div></div>
    <div class="row"><label style="display:flex;gap:10px;align-items:flex-start;font-size:14.5px;cursor:pointer"><input type="checkbox" name="agree" style="margin-top:4px"> I've read this and agree to it.</label></div>
    <button class="btn" type="submit" id="go" style="width:100%;padding:14px">Sign</button>
    <p class="err" id="err" role="alert"></p>
    <p class="muted" style="font-size:12px;margin:0">Your name, the time and your device are recorded with your signature.</p></form>`;
  const cv = $('cv'), cx = cv.getContext('2d'); let drawn = false, down = false, last;
  const fit = () => { const r = cv.getBoundingClientRect(); cv.width = r.width * 2; cv.height = r.height * 2; cx.lineWidth = 4; cx.lineCap = cx.lineJoin = 'round'; cx.strokeStyle = '#0E0E10'; };
  fit();
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * 2, (e.clientY - r.top) * 2]; };
  cv.addEventListener('pointerdown', e => { down = true; last = pos(e); cv.setPointerCapture(e.pointerId); $('hint').hidden = true; });
  cv.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); cx.beginPath(); cx.moveTo(...last); cx.lineTo(...p); cx.stroke(); last = p; drawn = true; });
  ['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { down = false; }));
  $('clr').onclick = () => { cx.clearRect(0, 0, cv.width, cv.height); drawn = false; $('hint').hidden = false; };
  const f = $('sf');
  if (f.minor) f.minor.onchange = () => { $('gr').hidden = !f.minor.checked; };
  f.onsubmit = async e => {
    e.preventDefault(); const err = $('err'); err.textContent = '';
    if (f.name.value.trim().length < 2) return err.textContent = 'Please type your full name.';
    if (f.minor && f.minor.checked && f.guardian.value.trim().length < 2) return err.textContent = "Please add your parent or guardian's name.";
    if (!drawn) return err.textContent = 'Please sign in the box.';
    if (!f.agree.checked) return err.textContent = 'Please tick to agree.';
    // shrink the signature before sending
    const s = document.createElement('canvas'); s.width = 600; s.height = Math.round(600 * cv.height / cv.width); s.getContext('2d').drawImage(cv, 0, 0, s.width, s.height);
    $('go').disabled = true;
    const r = await call('POST', { name: f.name.value.trim(), guardian: f.minor && f.minor.checked ? f.guardian.value.trim() : '', sig: s.toDataURL('image/png'), agree: true });
    const d = await r.json().catch(() => ({}));
    if (!r.ok && !d.form){ err.textContent = d.error || 'Something went wrong. Please try again.'; $('go').disabled = false; return; }
    data.form = d.form; show(); window.scrollTo({ top: 0, behavior: 'smooth' });
  };
}
(async () => {
  const r = await call('GET').catch(() => null);
  if (!r || !r.ok){ $('doc').innerHTML = '<p class="muted" style="text-align:center;padding:60px 0">This link isn’t valid any more. Please ask Aera for a new one.</p>'; return; }
  data = await r.json(); show();
})();
})();
</script>
</body>
</html>
