<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Pre-pro — Aera</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/logo/aera-monogram-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/client/client.css">
<script src="/client/forms.js"></script>
<style>
/* Pre-production workspace: one page per job, in the ivory client look.
   Everything autosaves; typing never re-renders, so focus is never lost. */
.top .in{max-width:1180px;margin:0 auto;padding:16px 32px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.top a.back{color:var(--stone);text-decoration:none;font-size:13px}.top a.back:hover{color:var(--cream)}
.hero{max-width:1180px;margin:0 auto;padding:16px 32px 28px}
.hero .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.hero h1{font-size:46px;line-height:1.05;margin:8px 0 4px}
.hero p{margin:0;color:#CFC4B0}
.btn.gold{background:var(--gold);color:#170e08}.btn.gold:hover{background:#D3BB8E;color:#170e08}
.btn.sm{padding:8px 14px;font-size:13px}
nav.secs{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
nav.secs .in{max-width:1180px;margin:0 auto;padding:0 32px;display:flex;gap:2px;overflow-x:auto}
nav.secs button{background:none;border:0;padding:14px 12px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav.secs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--gold-ink);font-weight:500}
nav.secs button b{font-weight:400;color:var(--stone);margin-left:4px;font-size:12px}
.saved{font-size:12.5px;color:var(--stone);margin-left:auto;align-self:center;white-space:nowrap;padding-left:12px}
main{max-width:1180px;margin:0 auto;padding:30px 32px 90px}
h2.sec{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}
.sechead .note{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:34px}
.card{background:#FBF8F2;border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.lab2{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
textarea.field{resize:vertical;min-height:70px;line-height:1.5}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row{margin-bottom:16px}
.chk{display:flex;gap:10px;align-items:center;font-size:14.5px;cursor:pointer}
.chk input{flex:none}
.empty{color:var(--muted);font-size:14px;padding:26px;text-align:center;border:1.5px dashed var(--field);border-radius:6px}
.x{background:none;border:0;color:var(--stone);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:4px}
.x:hover{color:var(--bad);background:rgba(164,71,58,.08)}
.chip{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--tint);color:var(--ink2)}
.seg{display:inline-flex;border:1px solid var(--field);border-radius:4px;overflow:hidden}
.seg button{background:var(--paper);border:0;border-right:1px solid var(--field);padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brown);color:var(--cream)}
/* overview */
dl.brief{display:grid;grid-template-columns:150px 1fr;gap:12px 18px;margin:0;font-size:16px}
dl.brief dt{color:var(--muted);font-size:14px}dl.brief dd{margin:0;white-space:pre-wrap}
.ready li{display:flex;gap:10px;font-size:14.5px}
.ready .ok{color:var(--ok)}.ready .todo{color:var(--gold-ink)}.ready .bad{color:var(--bad)}
.bar{height:4px;background:#E3DDD1;border-radius:2px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--gold-ink)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.strip img,.strip .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--tint)}
/* storyboard */
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.frame{background:#FBF8F2;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.shot{position:relative;background:#EDE6D8;border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .n{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;border-radius:999px;padding:1px 9px}
.shot .tools{position:absolute;bottom:8px;right:8px;display:flex;gap:6px;opacity:0;transition:opacity .2s}
.frame:hover .shot .tools,.shot .tools:focus-within,.shot.blank .tools{opacity:1}
.shot.blank .tools{position:static}
.tool{background:var(--paper);border:1px solid var(--field);border-radius:4px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.tool:hover{border-color:var(--ink)}
.frame .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.frame .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.frame select,.frame input.mini{font:400 12.5px var(--sans);border:1px solid var(--field);border-radius:4px;padding:5px 6px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
.frame textarea{font:400 14px var(--sans);border:1px solid var(--field);border-radius:4px;padding:7px 9px;background:var(--paper);resize:vertical;min-height:54px;width:100%}
.frame .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.addframe{border:1.5px dashed var(--field);border-radius:6px;background:none;cursor:pointer;color:var(--muted);font-size:14px;min-height:220px}
.addframe:hover{border-color:var(--ink);color:var(--ink)}
/* shot list */
table.sl{width:100%;border-collapse:collapse;font-size:14px}
table.sl th{text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.sl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.sl tr.got td{color:var(--stone);text-decoration:line-through}
table.sl img{width:72px;aspect-ratio:16/9;object-fit:cover;border-radius:3px;display:block}
.tablewrap{overflow-x:auto}
/* moodboard: image first, details in the viewer */
.mb-add{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:1.5px dashed var(--field);border-radius:8px;padding:12px 14px;margin-bottom:26px;background:transparent;transition:border-color .2s,background .2s}
.mb-add .lead{font-size:13.5px;color:var(--muted);flex:none}
.mb-add .field{flex:1 1 320px}
.drop.on{border-color:var(--gold-ink);background:rgba(194,168,120,.10);outline:none}
.mb-look{background:var(--brown);color:var(--cream);border-radius:10px;padding:22px 22px 18px;margin-bottom:30px}
.mb-look .lh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mb-look .k{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.mb-look h3{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 0;color:#F5EDE0;line-height:1.15}
.mb-look .lh .feel{font-size:14px;color:#CFC4B0;max-width:460px}
.look-grid{display:grid;grid-template-columns:2fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px;height:min(52vw,470px)}
.look-grid.n1{grid-template-columns:1fr}
.look-grid.n2{grid-template-columns:1fr 1fr}
.look-grid .t:first-child{grid-row:span 2}
.look-grid.n2 .t:first-child,.look-grid.n1 .t:first-child{grid-row:auto}
.look-grid .t{position:relative;border-radius:6px;overflow:hidden;cursor:zoom-in;background:#2a170c}
.look-grid .t img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.look-grid .t:hover img{transform:scale(1.03)}
.look-grid .t .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;font-size:13px;color:#F5EDE0;background:linear-gradient(transparent,rgba(14,8,4,.75))}
.look-more{display:flex;gap:8px;margin-top:10px}
.look-more .t{width:72px;height:54px;border-radius:4px;overflow:hidden;cursor:zoom-in;flex:none}
.look-more .t img{width:100%;height:100%;object-fit:cover}
.palette{display:flex;gap:6px;margin-top:14px;align-items:center}
.palette i{display:block;height:26px;flex:1;border-radius:4px;max-width:90px}
.palette span{font-size:11.5px;color:#A89B85;margin-right:6px;white-space:nowrap}
.mb-empty-look{border:1px dashed rgba(234,223,205,.35);border-radius:6px;padding:26px;text-align:center;color:#CFC4B0;font-size:14px}
.jump{position:sticky;top:49px;z-index:15;background:var(--paper);display:flex;gap:6px;flex-wrap:wrap;padding:10px 0;margin-bottom:6px;border-bottom:1px solid var(--line)}
.jump button{background:none;border:1px solid var(--field);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.jump button b{font-weight:400;color:var(--stone);margin-left:5px}
.jump button:hover{border-color:var(--ink)}
.jump .presbtn{margin-left:auto;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mb-sec{margin-top:26px;scroll-margin-top:110px}
.mb-sec h4{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-family:var(--display);font-weight:400;font-size:22px}
.mb-sec h4 small{font-family:var(--sans);font-size:13px;color:var(--stone)}
.mb-sec.sort h4{color:var(--gold-ink)}
.mb-sec .hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.tiles{columns:4 210px;column-gap:12px}
.tile{break-inside:avoid;margin:0 0 12px;position:relative;border-radius:6px;overflow:hidden;cursor:zoom-in;background:var(--tint);display:block;width:100%;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.tile img{width:100%;display:block;transition:transform .4s ease,filter .3s}
.tile:hover img{transform:scale(1.025)}
.tile .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;font-size:12.5px;color:#fff;background:linear-gradient(transparent,rgba(14,10,6,.72));opacity:0;transition:opacity .25s}
.tile:hover .ov,.tile:focus-visible .ov{opacity:1}
.tile .badges{position:absolute;top:8px;left:8px;display:flex;gap:5px}
.tile .bd{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:rgba(14,14,16,.78);color:#F5F1E9}
.tile .bd.star{background:var(--gold);color:#1b1108}
.tile .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.tile .play span{width:42px;height:42px;border-radius:50%;background:rgba(14,14,16,.6);display:grid;place-items:center;color:#fff;font-size:14px}
.tile.link{background:#FBF8F2;border:1px solid var(--line);padding:16px 14px;cursor:pointer}
.tile.link .h{font-size:14px;font-weight:500;color:var(--ink);word-break:break-all}
.tile.link .n{font-size:13px;color:var(--muted);margin-top:4px}
.tile.link .badges{position:static;margin-bottom:8px}
/* viewer */
.lb{position:fixed;inset:0;z-index:60;background:rgba(14,10,6,.92);display:grid;grid-template-columns:minmax(0,1fr) 340px}
.lb[hidden]{display:none}
.lb .stage{position:relative;display:grid;place-items:center;padding:40px 70px;min-height:0}
.lb .stage img{max-width:100%;max-height:calc(100vh - 80px);object-fit:contain;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lb .stage iframe{width:min(100%,960px);aspect-ratio:16/9;border:0;border-radius:4px}
.lb .stage .linkbig{color:#F5EDE0;font-size:18px;text-align:center}
.lb .stage .linkbig a{color:var(--gold)}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(245,241,233,.12);color:#F5EDE0;font-size:20px;cursor:pointer}
.lb .nav:hover{background:rgba(245,241,233,.22)}
.lb .prev{left:14px}.lb .next{right:14px}
.lb .count{position:absolute;top:16px;left:20px;color:#A89B85;font-size:13px}
.lb .side{background:var(--paper);padding:22px 22px 18px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.lb .side .top2{display:flex;justify-content:space-between;align-items:center}
.lb .side .k{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.lb .close{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.lb .starbtn{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--field);background:#FBF8F2;border-radius:6px;padding:11px 12px;cursor:pointer;font:500 14px var(--sans);color:var(--ink)}
.lb .starbtn[aria-pressed="true"]{background:var(--brown);border-color:var(--brown);color:var(--cream)}
.lb .starbtn span{font-size:18px;color:var(--gold)}
.lb .grp label,.lb .grp .lab2{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.lb .tags{display:flex;flex-wrap:wrap;gap:6px}
.lb .tags button{background:none;border:1px solid var(--field);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink2)}
.lb .tags button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.lb select,.lb textarea{width:100%;font:400 14px var(--sans);border:1px solid var(--field);border-radius:4px;padding:8px 10px;background:#fff;color:var(--ink)}
.lb textarea{min-height:90px;resize:vertical;line-height:1.5}
.lb .src{font-size:13px;color:var(--gold-ink);word-break:break-all}
.lb .del{margin-top:auto;background:none;border:0;color:var(--bad);font-size:13px;cursor:pointer;text-align:left;padding:0}
/* present */
.mbp{position:fixed;inset:0;z-index:70;background:#120a05;color:#F5EDE0;display:flex;flex-direction:column}
.mbp[hidden]{display:none}
.mbp .pt{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;font-size:13px;color:#A89B85}
.mbp .pt b{font-family:var(--display);font-weight:400;font-size:20px;color:#F5EDE0;letter-spacing:.02em}
.mbp .pt button{background:none;border:1px solid rgba(245,237,224,.25);color:#F5EDE0;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.mbp .ps{flex:1;display:grid;place-items:center;padding:0 90px;min-height:0;position:relative}
.mbp .ps img{max-width:100%;max-height:calc(100vh - 190px);object-fit:contain;border-radius:3px}
.mbp .pc{text-align:center;padding:16px 26px 26px;min-height:74px}
.mbp .pc .sec{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.mbp .pc p{margin:6px 0 0;font-size:17px;color:#E8DCC8}
.mbp .nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:0;background:rgba(245,241,233,.1);color:#F5EDE0;font-size:20px;cursor:pointer}
.mbp .prev{left:20px}.mbp .next{right:20px}
@media(max-width:860px){
  .lb{display:flex;flex-direction:column;overflow:auto}
  .lb .stage{flex:none;height:56vh;padding:44px 12px 12px}.lb .stage{overflow:hidden}.lb .stage img{max-height:calc(56vh - 58px)}.lb .stage iframe{max-height:calc(56vh - 58px)}.lb .nav{top:auto;bottom:8px;transform:none}.lb .side{flex:1}
  .look-grid,.look-grid.n1,.look-grid.n2{height:auto;grid-template-columns:1fr 1fr;grid-auto-rows:auto}.look-grid .t{height:150px}.look-grid .t:first-child,.look-grid.n2 .t:first-child{grid-column:1/-1;grid-row:auto;height:230px}
  .tiles{columns:2 140px}.jump{top:47px}.mbp .ps{padding:0 12px}.mbp .nav{display:none}
}
/* locations */
.locs{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
.loclist{display:flex;flex-direction:column;gap:8px}
.locbtn{text-align:left;background:#FBF8F2;border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;overflow:hidden;font:inherit;color:inherit}
.locbtn[aria-current="true"]{border-color:var(--gold-ink);box-shadow:0 0 0 1px var(--gold-ink)}
.locbtn img,.locbtn .ph{width:100%;height:96px;object-fit:cover;display:block;background:var(--tint)}
.locbtn .t{padding:9px 12px;font-size:14px}.locbtn .t small{display:block;color:var(--muted);font-size:12.5px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:6px 0 4px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}
.photos figure .x{position:absolute;top:4px;right:4px;background:rgba(245,241,233,.92)}
.photos .add{aspect-ratio:4/3;border:1.5px dashed var(--field);border-radius:4px;background:none;cursor:pointer;color:var(--muted);font-size:13px}
.rec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.list{display:flex;flex-direction:column;gap:6px}
.list .li{display:flex;gap:8px;align-items:center}
.list .li input[type=text]{flex:1;border:0;border-bottom:1px solid transparent;background:none;font:400 14.5px var(--sans);padding:3px 0;color:var(--ink)}
.list .li input[type=text]:focus{outline:none;border-bottom-color:var(--gold)}
.list .li.done input[type=text]{color:var(--stone);text-decoration:line-through}
.addline{background:none;border:0;color:var(--gold-ink);cursor:pointer;font-size:13.5px;padding:4px 0;text-align:left}
/* tables for people/schedule/paper */
.rows{display:flex;flex-direction:column;gap:8px}
.rows .r{display:grid;gap:8px;align-items:center}
.rows .r.p{grid-template-columns:1.1fr 1fr 1.2fr 1.4fr auto}
.rows .r.s{grid-template-columns:90px 2fr 1fr auto}
.rows .r.w{grid-template-columns:1.6fr 130px 1.4fr 1.2fr 90px auto}
.rows .field{padding:8px 10px;font-size:14px}
.sun{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.sun b{font-weight:600}
/* sketch */
.modal{position:fixed;inset:0;background:rgba(14,14,16,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.sk{background:var(--paper);border-radius:8px;padding:16px;width:min(960px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.sk canvas{width:100%;background:#fff;border:1px solid var(--line);border-radius:4px;touch-action:none;cursor:crosshair;display:block}
.sk .bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:80}
.toast.show{opacity:1}
@media(max-width:860px){.grid2,.locs,.rec{grid-template-columns:1fr}.hero h1{font-size:34px}.rows .r.p,.rows .r.w{grid-template-columns:1fr 1fr}.f2{grid-template-columns:1fr}main,.hero,.top .in,nav.secs .in{padding-left:16px;padding-right:16px}dl.brief{grid-template-columns:1fr}}
.sbbar{display:flex;gap:10px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.sb{display:flex;flex-direction:column}
.sbsec{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);font-weight:600;margin:26px 0 4px}
.sbsec:first-child{margin-top:0}
.sbrow{display:grid;grid-template-columns:300px minmax(0,1fr);gap:26px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
.sbrow .shot{border:1px solid var(--line);border-radius:4px}
.sbrow.must .shot{box-shadow:0 0 0 2px var(--gold)}
.sbh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.sbh h4{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.sbh .when{font-size:13.5px;color:var(--muted)}
.sbd p.tech{margin:0 0 8px;font-size:14px;color:var(--ink2)}.sbd p.tech i{font-style:normal;color:var(--stone);margin:0 7px}
.sbd p.act{margin:0 0 12px;font-size:16.5px;line-height:1.5}
.sbd dl.ex{display:grid;grid-template-columns:76px 1fr;gap:5px 12px;margin:0;font-size:14px}
.sbd dl.ex dt{color:var(--muted);font-size:12.5px;letter-spacing:.04em;padding-top:1px}.sbd dl.ex dd{margin:0}
.feg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

  </div></div>

</div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jobId = new URLSearchParams(location.search).get('job') || '';
const SECTIONS = [['overview','Overview'],['brief','Brief'],['mood','Moodboard'],['board','Storyboard'],['shots','Shot list'],['locs','Locations'],['people','People & props'],['schedule','Schedule'],['paper','Paperwork']];
const SIZES = ['','EWS','WS','MS','MCU','CU','ECU','OTS','POV','Insert','Two-shot'];
const ANGLES = ['','Eye level','Low','High','Overhead','Dutch'];
const MOVES = ['','Static','Pan','Tilt','Push in','Pull out','Slide','Handheld','Gimbal','Drone'];
const CAMS = ['','A','B','Stills','Phone'];
const TAGS = ['Light','Colour','Framing','Wardrobe','Location','Stills','Edit'];
const LOCSECS = [['access','Getting in','Parking, load-in route, stairs or lift, access times'],['light','Light','Window direction, blackout, practicals, sun on the day'],['power','Power','Sockets, circuits, what can run where'],['sound','Sound','Traffic, fans, fridges, neighbours, flight path'],['site','On site','Toilets, green room, food, signal and wifi, smoke alarms'],['permission','Permission','Contact, fee, hours allowed, what we can move']];
let job = null, doc = null, sec = (location.hash.slice(1) || 'overview'), saveT = null, moodFilter = 'All', locSel = 0;

function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800); }
async function api(url, method = 'GET', body){
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401){ location.href = '/portal/'; throw new Error('signed out'); }
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Request failed'); return d;
}
const imgSrc = id => '/api/img?id=' + id;
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|v=|shorts\/)([\w-]{11})/); return m ? m[1] : ''; };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const shortDate = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' }) : '';
const uid = () => crypto.randomUUID();

/* ---------- saving: every change goes through here ---------- */
let statusText = 'Saved';
function setStatus(t){ statusText = t; const s = $('saved'); if (s) s.textContent = t; }
function save(){ setStatus('Saving…'); clearTimeout(saveT); saveT = setTimeout(async () => {
  try { await api('/portal/api/prepro', 'PUT', { job: jobId, data: doc }); setStatus('Saved'); }
  catch { setStatus('Not saved. Check your connection'); }
}, 800); }
function setPath(path, val){ const ks = path.split('.'); let o = doc; ks.slice(0, -1).forEach(k => { o = o[k]; }); o[ks[ks.length - 1]] = val; }
function getPath(path){ return path.split('.').reduce((o, k) => o == null ? o : o[k], doc); }
// typing: update the doc, never re-render
document.addEventListener('input', e => { const u = e.target.closest('[data-use]');
  if (u){ const fm = doc.forms.find(x => x.id === formSel); const set = new Set(fm.uses || []); u.checked ? set.add(u.dataset.use) : set.delete(u.dataset.use); fm.uses = window.AERA_FORMS.USES.filter(x => set.has(x)); save(); $('formprev').innerHTML = window.AERA_FORMS.render(fm, job); return; }
  const el = e.target.closest('[data-k]'); if (!el) return;
  if (el.dataset.pv){ setPath(el.dataset.k, el.value); save(); const fm = doc.forms.find(x => x.id === formSel); if (fm) $('formprev').innerHTML = window.AERA_FORMS.render(fm, job); return; }
  setPath(el.dataset.k, el.type === 'checkbox' ? el.checked : el.value); save(); if (el.dataset.re) render(); });
document.addEventListener('change', e => { const el = e.target.closest('[data-k]'); if (!el || el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text')) return;
  setPath(el.dataset.k, el.type === 'checkbox' ? el.checked : el.value); save(); render(); });

/* ---------- images ---------- */
async function shrink(file){
  if (!/^image\//.test(file.type)) throw new Error('Not an image');
  const bmp = await createImageBitmap(file); const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', .84));
}
async function upload(blob){
  const r = await fetch('/portal/api/img', { method: 'POST', headers: { 'Content-Type': blob.type }, body: blob });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Upload failed'); return d.id;
}
let pickCb = null;
function pickFiles(cb, multiple = true){ pickCb = cb; $('file').multiple = multiple; $('file').value = ''; $('file').click(); }
$('file').addEventListener('change', async () => { const files = [...$('file').files]; if (pickCb && files.length) pickCb(files); });
async function uploadFiles(files){
  const ids = []; toast(files.length > 1 ? `Uploading ${files.length} images…` : 'Uploading…');
  for (const f of files){ try { ids.push(await upload(await shrink(f))); } catch (x) { toast(x.message); } }
  return ids;
}

/* ---------- readiness ---------- */
function checks(){
  const main = doc.locations.find(l => l.role === 'Main');
  const out = [
    [doc.brief.agreed, 'Brief agreed with the client', 'Brief not agreed yet'],
    [doc.mood.length > 0, `Moodboard · ${doc.mood.length}`, 'Moodboard is empty'],
    [doc.frames.length > 0, `Storyboard · ${doc.frames.length} frames`, 'No storyboard frames yet'],
    [!!main && ['Recced','Booked'].includes(main.status), 'Main location recced', main ? `${main.name || 'Main location'}: ${main.status.toLowerCase()}` : 'No main location yet'],
    [doc.schedule.length > 0, 'Schedule written', 'No schedule yet'],
    [doc.people.length > 0, 'People and contacts in', 'No people added yet']
  ].map(([ok, y, n]) => ({ state: ok ? 'ok' : 'todo', text: ok ? y : n }));
  doc.locations.forEach(l => l.problems.filter(p => !p.done).forEach(p => out.push({ state: 'bad', text: `${l.name || 'Location'}: ${p.text}` })));
  doc.paper.filter(p => p.status !== 'Not needed').forEach(p => out.push({ state: p.status === 'Done' ? 'ok' : p.status === 'Sent' ? 'todo' : 'bad', text: p.status === 'Done' ? p.text : `${p.text}: ${p.status.toLowerCase()}` }));
  return out;
}

/* ---------- sun times (sunrise equation) for Leeds ---------- */
function sun(dateStr, lat = 53.8, lng = -1.55){
  if (!dateStr) return null;
  const R = Math.PI / 180, d = new Date(dateStr + 'T12:00:00Z');
  const n = Math.ceil(d / 864e5 + 2440587.5 - 2451545 + .0008), J = n - lng / 360;
  const M = (357.5291 + .98560028 * J) % 360, C = 1.9148 * Math.sin(M * R) + .02 * Math.sin(2 * M * R) + .0003 * Math.sin(3 * M * R);
  const L = (M + C + 180 + 102.9372) % 360, Jt = 2451545 + J + .0053 * Math.sin(M * R) - .0069 * Math.sin(2 * L * R);
  const dec = Math.asin(Math.sin(L * R) * Math.sin(23.4397 * R));
  const w = Math.acos((Math.sin(-.833 * R) - Math.sin(lat * R) * Math.sin(dec)) / (Math.cos(lat * R) * Math.cos(dec))) / R;
  const t = j => new Date((j - 2440587.5) * 864e5).toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit' });
  return { rise: t(Jt - w / 360), set: t(Jt + w / 360), golden: t(Jt + w / 360 - 1 / 24) };
}

/* ---------- rendering ---------- */
function renderNav(){
  const count = { mood: doc.mood.length, board: doc.frames.length, shots: doc.frames.filter(f => f.got).length + '/' + doc.frames.length, locs: doc.locations.length, paper: doc.paper.filter(p => p.status === 'Done').length + '/' + doc.paper.filter(p => p.status !== 'Not needed').length };
  $('nav').innerHTML = SECTIONS.map(([k, t]) => `<button data-sec="${k}" aria-current="${k === sec}">${esc(t)}${count[k] !== undefined && doc.frames ? `<b>${count[k]}</b>` : ''}</button>`).join('') + `<span class="saved" id="saved">${statusText}</span>`;
}
function render(){
  renderNav();
  const f = { overview, brief, mood, board, shots, locs, people, schedule, paper, form }[sec] || overview;
  $('app').innerHTML = `<div class="fade-in">${f()}</div>`;
  if (sec === 'mood') paintPalette();
  if (lbCur >= 0) renderLB();
}
const head = (t, note = '') => `<div class="sechead"><h2 class="sec">${t}</h2>${note ? `<span class="note">${note}</span>` : ''}</div>`;
const field = (k, label, ph = '', ta = false) => `<div class="row"><label class="lab2" for="f-${k}">${label}</label>${ta
  ? `<textarea class="field" id="f-${k}" data-k="${k}" placeholder="${esc(ph)}">${esc(getPath(k))}</textarea>`
  : `<input class="field" id="f-${k}" data-k="${k}" placeholder="${esc(ph)}" value="${esc(getPath(k))}">`}</div>`;
const opts = (list, v) => (v && !list.includes(v) ? [list[0], v, ...list.slice(1)] : list).map(o => `<option${o === v ? ' selected' : ''} value="${esc(o)}">${esc(o || '—')}</option>`).join('');
const lineList = (path, ph) => `<div class="list">${getPath(path).map((x, i) => `<div class="li${x.done ? ' done' : ''}"><input type="checkbox" data-k="${path}.${i}.done" aria-label="Done"><input type="text" data-k="${path}.${i}.text" value="${esc(x.text)}" placeholder="${esc(ph)}"><button class="x" data-del="${path}.${i}" aria-label="Remove">×</button></div>`).join('')}
  <button class="addline" data-addline="${path}">+ Add</button></div>`.replace(/data-k="([^"]+\.done)"/g, (m, k) => m + (getPath(k) ? ' checked' : ''));

function overview(){
  const b = doc.brief, c = checks(), done = c.filter(x => x.state === 'ok').length, main = doc.locations.find(l => l.role === 'Main') || doc.locations[0];
  const s = sun(doc.date || job.date);
  const crew = doc.people.length ? doc.people.slice(0, 5).map(p => `${p.name}${p.role ? ' · ' + p.role : ''}`) : String(job.assignee || '').split(',').map(x => x.trim()).filter(Boolean);
  const briefRows = [['What it\'s for', b.purpose], ['Who it\'s for', b.audience], ['How it should feel', b.feel], ['Must have', b.must], ['Avoid', b.avoid], ['Delivering', b.deliverables], ['Due', b.due]].filter(x => x[1]);
  return `<div class="grid2"><div>
    <section>${head('The brief', b.agreed ? '<span style="color:var(--ok)">Agreed with the client</span>' : '<a href="#brief" data-go="brief">Edit</a>')}
      ${briefRows.length ? `<dl class="brief">${briefRows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : `<div class="empty">No brief yet. <a href="#brief" data-go="brief">Write it</a></div>`}</section>
    <section style="margin-top:40px">${head('The look', `<a href="#mood" data-go="mood">Open moodboard${doc.mood.length ? ' · ' + doc.mood.length : ''}</a>`)}
      ${doc.mood.some(m => m.img || ytId(m.url)) ? `<div class="strip">${[...doc.mood.filter(m => m.main), ...doc.mood.filter(m => !m.main)].filter(m => m.img || ytId(m.url)).slice(0, 5).map(m => `<img src="${m.img ? imgSrc(m.img) : `https://img.youtube.com/vi/${ytId(m.url)}/hqdefault.jpg`}" alt="${esc(m.note || m.tag || 'Reference')}" loading="lazy">`).join('')}</div>` : `<div class="empty">Nothing on the moodboard yet.</div>`}</section>
    <section style="margin-top:40px">${head('Storyboard', `<a href="#board" data-go="board">${doc.frames.length} frame${doc.frames.length === 1 ? '' : 's'} · open</a>`)}
      ${doc.frames.length ? `<div class="frames" style="grid-template-columns:repeat(3,1fr)">${doc.frames.slice(0, 3).map((fr, i) => `<figure style="margin:0"><div class="shot" style="aspect-ratio:${ar()}">${fr.img ? `<img src="${imgSrc(fr.img)}" alt="Frame ${i + 1}" loading="lazy">` : ''}<span class="n">${i + 1}</span></div><figcaption style="font-size:13.5px;margin-top:6px">${esc([fr.size, fr.move].filter(Boolean).join(', '))}${fr.desc ? ' · ' + esc(fr.desc) : ''}</figcaption></figure>`).join('')}</div>` : `<div class="empty">No frames yet.</div>`}</section>
  </div><aside style="display:flex;flex-direction:column;gap:20px">
    <div class="card"><h3>Ready for the day</h3><div class="display" style="font-size:32px">${done} of ${c.length}</div><div class="bar"><i style="width:${c.length ? done / c.length * 100 : 0}%"></i></div>
      <ul class="ready" style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">${c.map(x => `<li><span class="${x.state}">${x.state === 'ok' ? '✓' : x.state === 'bad' ? '!' : '○'}</span>${esc(x.text)}</li>`).join('')}</ul></div>
    <div class="card"><h3>Where</h3>${main ? `${main.photos[0] ? `<img src="${imgSrc(main.photos[0])}" alt="" style="width:100%;height:130px;object-fit:cover;border-radius:4px;display:block;margin-bottom:10px">` : ''}<b style="font-weight:600">${esc(main.name || 'Unnamed location')}</b><div style="font-size:14px;color:var(--muted)">${esc(main.status)}${main.address ? ' · ' + esc(main.address) : ''}</div><a href="#locs" data-go="locs" style="font-size:13px">Recce report</a>` : `<p style="margin:0;color:var(--muted)">No location yet. <a href="#locs" data-go="locs">Add one</a></p>`}</div>
    <div class="card"><h3>On the day</h3><dl style="margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px">
      <dt style="color:var(--muted)">Date</dt><dd style="margin:0">${esc(shortDate(doc.date || job.date) || 'Not set')}</dd>
      ${doc.schedule.length ? `<dt style="color:var(--muted)">First</dt><dd style="margin:0">${esc(doc.schedule[0].time)} ${esc(doc.schedule[0].what)}</dd><dt style="color:var(--muted)">Last</dt><dd style="margin:0">${esc(doc.schedule[doc.schedule.length - 1].time)} ${esc(doc.schedule[doc.schedule.length - 1].what)}</dd>` : ''}
      ${s ? `<dt style="color:var(--muted)">Light</dt><dd style="margin:0">Sunrise ${s.rise} · sunset ${s.set}</dd>` : ''}
      ${crew.length ? `<dt style="color:var(--muted)">Crew</dt><dd style="margin:0">${crew.map(esc).join('<br>')}</dd>` : ''}</dl></div>
  </aside></div>`;
}
function brief(){
  return head('Brief', 'What we agreed with the client, in plain words') + `<div style="max-width:760px">
    ${field('brief.purpose', 'What it\'s for', 'e.g. Launch the new single and give promoters something to book from', true)}
    ${field('brief.audience', 'Who it\'s for', 'e.g. Leeds gig-goers, 18–30, on Instagram and TikTok', true)}
    ${field('brief.feel', 'How it should feel', 'Three or four words, or a sentence', true)}
    ${field('brief.must', 'Must have', 'The shots or moments we can\'t miss', true)}
    ${field('brief.avoid', 'Avoid', 'Anything the client doesn\'t want', true)}
    ${field('brief.deliverables', 'What we\'re delivering', 'e.g. 3 songs in 16:9 4K, 3 reels in 9:16, 30 stills', true)}
    ${field('brief.due', 'When it\'s due', 'e.g. Reels by 20 Dec, full songs by 3 Jan')}
    <label class="chk"><input type="checkbox" data-k="brief.agreed"${doc.brief.agreed ? ' checked' : ''}> The client has agreed this brief</label></div>`;
}
/* ---------- moodboard: image first, details in a viewer ---------- */
const tagOf = m => TAGS.includes(m.tag) ? m.tag : '';
const shotNo = id => doc.frames.findIndex(f => f.id === id) + 1;
const thumb = m => m.img ? imgSrc(m.img) : ytId(m.url) ? `https://img.youtube.com/vi/${ytId(m.url)}/hqdefault.jpg` : '';
const isLook = m => m.main && thumb(m);
let lbCur = -1, presI = 0, presList = [];
// one reading order for the page, the viewer and Present: the look first, then each section
function moodOrder(){
  const all = doc.mood.map((m, i) => i), out = all.filter(i => isLook(doc.mood[i]));
  ['', ...TAGS].forEach(t => all.filter(i => !isLook(doc.mood[i]) && tagOf(doc.mood[i]) === t).forEach(i => out.push(i)));
  return out;
}
function tileHtml(i){ const m = doc.mood[i], src = thumb(m), sn = m.shot ? shotNo(m.shot) : 0;
  const badges = (m.main || sn) ? `<span class="badges">${m.main ? '<span class="bd star">★ Main</span>' : ''}${sn ? `<span class="bd">Shot ${sn}</span>` : ''}</span>` : '';
  if (!src) return `<button class="tile link" data-lb="${i}">${badges}<div class="h">↗ ${esc(host(m.url) || 'Link')}</div>${m.note ? `<div class="n">${esc(m.note)}</div>` : ''}</button>`;
  return `<button class="tile" data-lb="${i}" aria-label="${esc(m.note || 'Open reference')}"><img src="${src}" alt="" loading="lazy">${ytId(m.url) && !m.img ? '<span class="play"><span>▶</span></span>' : ''}${badges}${m.note ? `<span class="ov">${esc(m.note)}</span>` : ''}</button>`;
}
function mood(){
  const looks = doc.mood.map((m, i) => i).filter(i => isLook(doc.mood[i])), big = looks.slice(0, 3), more = looks.slice(3);
  const feel = ((doc.brief || {}).feel || '').trim();
  let look = `<section class="mb-look"><div class="lh"><div><div class="k">The look</div><h3>${feel ? esc(feel) : 'Main inspos'}</h3></div>${looks.length ? '' : ''}</div>`;
  look += looks.length
    ? `<div class="look-grid n${big.length}">${big.map(i => `<div class="t" data-lb="${i}"><img src="${thumb(doc.mood[i])}" alt="">${doc.mood[i].note ? `<div class="cap">${esc(doc.mood[i].note)}</div>` : ''}</div>`).join('')}</div>${more.length ? `<div class="look-more">${more.map(i => `<div class="t" data-lb="${i}"><img src="${thumb(doc.mood[i])}" alt=""></div>`).join('')}</div>` : ''}<div class="palette" id="palette"></div>`
    : `<div class="mb-empty-look">Open any reference and choose <b>Make it a main inspo</b>. The strongest three sit here, big, with a colour palette pulled from them.</div>`;
  look += '</section>';
  const groups = [['', 'To sort', 'Not in a section yet. Open one to give it a section.'], ...TAGS.map(t => [t, t, ''])]
    .map(([t, label, hint]) => ({ t, label, hint, items: doc.mood.map((m, i) => i).filter(i => !isLook(doc.mood[i]) && tagOf(doc.mood[i]) === t) }))
    .filter(g => g.items.length);
  const pinned = doc.mood.filter(m => m.shot).length;

      ${d.sign && !f.sig ? `<p style="font-size:13px;color:var(--muted)">Send the link to ${esc(d.signer.toLowerCase())}. They read it, type their name and sign on their phone. It shows as signed here, and the paperwork item ticks itself off.</p>` : ''}
    </div><div id="formprev">${F.render(f, job)}</div></div>`;
}
/* ---------- clicks ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 'lb'){ closeLB(); render(); return; }
  const lbo = t.closest('[data-lb]'); if (lbo){ openLB(+lbo.dataset.lb); return; }
  if (t.closest('[data-lbclose]')){ closeLB(); render(); return; }
  const lg = t.closest('[data-lbgo]'); if (lg){ lbStep(+lg.dataset.lbgo); return; }
  const lt = t.closest('[data-lbtag]'); if (lt){ const m = doc.mood[lbCur]; m.tag = m.tag === lt.dataset.lbtag ? '' : lt.dataset.lbtag; save(); render(); return; }
  if (t.closest('[data-lbdel]')){ const L = moodOrder(), p = L.indexOf(lbCur); doc.mood.splice(lbCur, 1); save(); const L2 = moodOrder(); if (!L2.length){ closeLB(); render(); } else { const nx = L[p + 1] !== undefined ? L[p + 1] : L[p - 1]; lbCur = nx > lbCur ? nx - 1 : nx; render(); } toast('Removed'); return; }
  const jp = t.closest('[data-jump]'); if (jp){ const el = $('mb-' + jp.dataset.jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.closest('#presbtn')){ openPres(); return; }
  if (t.closest('[data-presclose]')){ closePres(); return; }
  const pg = t.closest('[data-presgo]'); if (pg){ presStep(+pg.dataset.presgo); return; }
  const go = t.closest('[data-go],[data-sec]'); if (go){ e.preventDefault(); sec = go.dataset.go || go.dataset.sec; history.replaceState(null, '', '#' + sec); render(); window.scrollTo({ top: 0 }); return; }
  const del = t.closest('[data-del]'); if (del){ const ks = del.dataset.del.split('.'); const i = +ks.pop(); getPath(ks.join('.')).splice(i, 1); save(); render(); return; }
  const al = t.closest('[data-addline]'); if (al){ getPath(al.dataset.addline).push({ text: ' ', done: false }); save(); render(); const ins = document.querySelectorAll(`[data-k^="${al.dataset.addline}."][type=text]`); const last = ins[ins.length - 1]; if (last){ last.value = ''; setPath(last.dataset.k, ''); last.focus(); } return; }
  const st = t.closest('[data-star]'); if (st){ const m = doc.mood[+st.dataset.star]; m.main = !m.main; save(); render(); toast(m.main ? 'Added to main inspos' : 'Removed from main inspos'); return; }
  const edb = t.closest('[data-edit]'); if (edb){ const id = edb.dataset.edit; editing.has(id) ? editing.delete(id) : editing.add(id); render(); return; }
  const nf = t.closest('[data-newform]'); if (nf){ newForm(nf.dataset.newform); return; }
  const of = t.closest('[data-openform]'); if (of){ formSel = of.dataset.openform; sec = 'form'; render(); window.scrollTo({ top: 0 }); return; }
  const df = t.closest('[data-delform]'); if (df){ if (!confirm('Delete this form? A signed copy will be lost.')) return; doc.forms = doc.forms.filter(x => x.id !== df.dataset.delform); doc.paper.forEach(p => { if (p.formId === df.dataset.delform) p.formId = ''; }); save(); sec = 'paper'; render(); return; }
  const fl = t.closest('[data-filter]'); if (fl){ moodFilter = fl.dataset.filter; render(); return; }
  const as = t.closest('[data-aspect]'); if (as){ doc.aspect = as.dataset.aspect; save(); render(); return; }
  const mv = t.closest('[data-move]'); if (mv){ const [i, d] = mv.dataset.move.split(':').map(Number); const j = i + d; if (j < 0 || j >= doc.frames.length) return; [doc.frames[i], doc.frames[j]] = [doc.frames[j], doc.frames[i]]; save(); render(); return; }
  const lo = t.closest('[data-loc]'); if (lo){ locSel = +lo.dataset.loc; render(); return; }
  const dl = t.closest('[data-delloc]'); if (dl){ if (!confirm('Delete this location and its recce notes?')) return; doc.locations.splice(+dl.dataset.delloc, 1); locSel = 0; save(); render(); return; }
  const fi = t.closest('[data-fimg]'); if (fi){ const i = +fi.dataset.fimg; pickFiles(async files => { const [id] = await uploadFiles(files.slice(0, 1)); if (id){ doc.frames[i].img = id; save(); render(); } }, false); return; }
  const sk = t.closest('[data-sketch]'); if (sk){ openSketch(+sk.dataset.sketch); return; }
  switch (t.id){
    case 'addframe': case 'addshot': { const nid = uid(); editing.add(nid); doc.frames.push({ id: nid, img: '', size: '', angle: '', move: '', lens: '', cam: '', when: '', desc: '', audio: '', must: false, got: false }); save(); render(); if (t.id === 'addframe'){ const c = document.querySelectorAll('.sbrow'); c[c.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' }); } return; }
    case 'addurlbtn': return addUrl();
    case 'addimg': return pickFiles(async files => { const ids = await uploadFiles(files); ids.forEach(id => doc.mood.push({ id: uid(), img: id, url: '', tag: moodFilter !== 'All' && TAGS.includes(moodFilter) ? moodFilter : '', note: '', shot: '', by: '' })); if (ids.length){ save(); render(); toast('Added'); } });
    case 'addloc': doc.locations.push({ id: uid(), name: '', role: doc.locations.some(l => l.role === 'Main') ? 'Backup' : 'Main', status: 'Idea', address: '', contact: '', recce: '', photos: [], access: '', light: '', power: '', sound: '', site: '', permission: '', problems: [] }); locSel = doc.locations.length - 1; save(); render(); return;
    case 'addphotos': return pickFiles(async files => { const ids = await uploadFiles(files); doc.locations[locSel].photos.push(...ids); if (ids.length){ save(); render(); } });
    case 'addperson': doc.people.push({ name: ' ', role: '', contact: '', notes: '' }); render(); { const r = document.querySelectorAll('.r.p input'); const f = r[r.length - 4]; f.value = ''; doc.people[doc.people.length - 1].name = ''; f.focus(); } return;
    case 'addslot': doc.schedule.push({ time: '', what: ' ', who: '' }); render(); { const r = document.querySelectorAll('.r.s input'); const f = r[r.length - 3]; doc.schedule[doc.schedule.length - 1].what = ''; r[r.length - 2].value = ''; f.focus(); } return;
    case 'printform': window.print(); return;
    case 'addrisk': { const fm = doc.forms.find(x => x.id === formSel); fm.rows.push({ hazard: '', who: '', control: '', level: 'Low' }); save(); render(); return; }
    case 'signlink': { try { await api('/portal/api/prepro', 'PUT', { job: jobId, data: doc }); const { key } = await api('/portal/api/prepro', 'POST', { job: jobId, action: 'formlink', form: formSel }); const link = location.origin + '/sign/#' + key;
      const p = doc.paper.find(x => x.formId === formSel); if (p && p.status === 'To do'){ p.status = 'Sent'; save(); }
      try { await navigator.clipboard.writeText(link); toast('Signing link copied'); } catch { prompt('Signing link:', link); } } catch (x) { toast(x.message); } return; }
    case 'sortslots': doc.schedule.sort((a, b) => a.time.localeCompare(b.time)); save(); render(); return;
    case 'addpaper': doc.paper.push({ text: 'New item', status: 'To do', url: '', note: '' }); save(); render(); return;
  }
});
document.addEventListener('keydown', e => {
  if (lbCur >= 0){ if (e.target.matches('input,textarea,select')){ if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === 'ArrowRight'){ lbStep(1); return; } if (e.key === 'ArrowLeft'){ lbStep(-1); return; } if (e.key === 'Escape'){ closeLB(); render(); return; } }
  if (!$('pres').hidden){ if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); presStep(1); return; } if (e.key === 'ArrowLeft'){ presStep(-1); return; } if (e.key === 'Escape'){ closePres(); return; } }
  if (e.key === 'Enter' && e.target.id === 'addurl'){ e.preventDefault(); addUrl(); }
  if (e.key === 'Enter' && e.target.matches('.list .li input[type=text]')){ e.preventDefault(); const path = e.target.dataset.k.split('.').slice(0, -2).join('.'); document.querySelector(`[data-addline="${path}"]`).click(); }
});
function newForm(type){
  const F = window.AERA_FORMS, d = F.defs[type], main = doc.locations.find(l => l.role === 'Main') || {};
  const date = shortDate(doc.date || job.date), project = job.client + (job.type ? ' · ' + job.type : '');
  const pre = { talent: { project, dates: date, location: main.name || '', fee: 'None' },
    location: { place: main.name || '', address: main.address || '', contact: main.contact || '', project, dates: date, fee: 'None' },
    risk: { project, date, location: [main.name, main.address].filter(Boolean).join(', '), lead: 'Jack Careem', emergency: '999' },
    music: { track: '', artist: '' } }[type] || {};
  const f = { id: uid(), type, title: d.title, fields: pre, uses: type === 'talent' ? ["The client's own channels", 'Aera portfolio and website', 'Aera social media'] : [],
    rows: type === 'risk' ? F.RISK_ROWS.map(([hazard, who, control]) => ({ hazard, who, control, level: 'Low' })) : [], key: '', sig: null };
  doc.forms = doc.forms || []; doc.forms.push(f);
  const label = d.title + (type === 'talent' ? '' : '');
  const existing = doc.paper.find(p => !p.formId && p.text.toLowerCase().startsWith(d.title.toLowerCase().split(' ')[0]));
  if (existing) existing.formId = f.id; else doc.paper.push({ text: label, status: 'To do', url: '', note: '', formId: f.id });
  save(); formSel = f.id; sec = 'form'; render(); window.scrollTo({ top: 0 });
}
function addUrl(){
  const v = $('addurl').value.trim(); if (!/^https?:\/\//i.test(v)){ toast('Paste a full link starting with https://'); return; }
  doc.mood.push({ id: uid(), img: '', url: v, tag: '', note: '', shot: '', by: '' }); save(); render(); toast('Added');
}
// paste or drop images on the moodboard (or a frame's page)
document.addEventListener('paste', async e => {
  if (sec !== 'mood' || e.target.matches('input,textarea')) return;
  const files = [...(e.clipboardData || {}).files || []].filter(f => /^image\//.test(f.type)); if (!files.length) return;
  e.preventDefault(); const ids = await uploadFiles(files); ids.forEach(id => doc.mood.push({ id: uid(), img: id, url: '', tag: '', note: '', shot: '', by: '' })); if (ids.length){ save(); render(); }
});
document.addEventListener('dragover', e => { if (sec === 'mood' || sec === 'locs'){ e.preventDefault(); } });
document.addEventListener('drop', async e => {
  if (sec !== 'mood' && sec !== 'locs') return; e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => /^image\//.test(f.type)); if (!files.length) return;
  const ids = await uploadFiles(files);
  if (sec === 'mood') ids.forEach(id => doc.mood.push({ id: uid(), img: id, url: '', tag: '', note: '', shot: '', by: '' }));
  else if (doc.locations[locSel]) doc.locations[locSel].photos.push(...ids);
  if (ids.length){ save(); render(); }
});

/* ---------- sketch pad ---------- */
const cv = $('sk-c'), cx = cv.getContext('2d'); let skI = -1, drawing = false, last = null, pen = { w: 3, erase: false }, undo = [];
function sizeCanvas(){ const [w, h] = doc.aspect.split(':').map(Number); cv.width = 1600; cv.height = Math.round(1600 * h / w); if (cv.height > 1600){ cv.height = 1600; cv.width = Math.round(1600 * w / h); } }
function openSketch(i){
  skI = i; sizeCanvas(); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); undo = [];
  $('sk-n').textContent = i + 1; $('sketch').hidden = false;
  cv.style.maxHeight = '70vh'; cv.style.width = 'auto'; cv.style.maxWidth = '100%'; cv.style.margin = '0 auto';
}
const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); undo.push(cx.getImageData(0, 0, cv.width, cv.height)); if (undo.length > 30) undo.shift(); dot(last); });
cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); cx.strokeStyle = pen.erase ? '#fff' : '#111'; cx.lineWidth = pen.w * (cv.width / 800) * (e.pressure && e.pointerType === 'pen' ? .5 + e.pressure : 1); cx.lineCap = cx.lineJoin = 'round'; cx.beginPath(); cx.moveTo(...last); cx.lineTo(...p); cx.stroke(); last = p; });
const dot = p => { cx.fillStyle = pen.erase ? '#fff' : '#111'; cx.beginPath(); cx.arc(p[0], p[1], pen.w * (cv.width / 800) / 2, 0, 7); cx.fill(); };
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => cv.addEventListener(ev, () => { drawing = false; }));
$('sk-pen').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; pen = { w: +b.dataset.w, erase: !!b.dataset.erase }; [...$('sk-pen').children].forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
$('sk-undo').addEventListener('click', () => { const u = undo.pop(); if (u) cx.putImageData(u, 0, 0); });
$('sk-clear').addEventListener('click', () => { undo.push(cx.getImageData(0, 0, cv.width, cv.height)); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); });
$('sk-cancel').addEventListener('click', () => { $('sketch').hidden = true; });
$('sk-save').addEventListener('click', async () => {
  const b = $('sk-save'); b.disabled = true;
  try { const blob = await new Promise(r => cv.toBlob(r, 'image/png')); const id = await upload(blob); doc.frames[skI].img = id; save(); $('sketch').hidden = true; render(); }
  catch (x) { toast(x.message); } finally { b.disabled = false; }
});

/* ---------- crew pack ---------- */
$('crewbtn').addEventListener('click', async () => {
  try { const { key } = await api('/portal/api/prepro', 'POST', { job: jobId, action: 'crew' }); const link = location.origin + '/crew/#' + key;
    try { await navigator.clipboard.writeText(link); toast('Crew pack link copied'); } catch { prompt('Crew pack link:', link); }
  } catch { toast('Couldn’t make the link'); }
});

/* ---------- start ---------- */
{ const st = document.createElement('style'); st.textContent = window.AERA_FORMS.css; document.head.appendChild(st); }
(async () => {
  if (!jobId){ $('app').innerHTML = '<div class="empty">Open pre-pro from a job in the portal.</div>'; return; }
  try { const d = await api('/portal/api/prepro?job=' + encodeURIComponent(jobId)); job = d.job; doc = d.prepro; }
  catch (x) { $('app').innerHTML = `<div class="empty">${esc(x.message)}. <a href="/portal/">Back to the portal</a></div>`; return; }
  document.title = 'Pre-pro · ' + job.client + ' — Aera';
  $('title').textContent = job.client + (job.type ? ' · ' + job.type : '');
  const days = job.date ? Math.ceil((new Date(job.date + 'T12:00:00') - Date.now()) / 864e5) : null;
  $('meta').textContent = [shortDate(doc.date || job.date) || 'No date yet', job.assignee, days != null ? (days > 0 ? `${days} days to go` : days === 0 ? 'Today' : 'Shot') : ''].filter(Boolean).join(' · ');
  $('back').href = '/portal/#job=' + encodeURIComponent(jobId);
  if (!SECTIONS.some(s => s[0] === sec)) sec = 'overview';
  render();
})();
window.addEventListener('beforeunload', e => { if ($('saved') && /Saving/.test($('saved').textContent)){ e.preventDefault(); e.returnValue = ''; } });
})();
</script>
